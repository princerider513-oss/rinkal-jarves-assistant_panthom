<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>rinkal bhai ka jarves assistant</title>
<meta name="description" content="rinkal bhai ka jarves assistant - a futuristic voice-enabled AI assistant">
<style>
  :root{
    --bg-0:#04060d;
    --bg-1:#0a0f1e;
    --panel:#0e1526;
    --panel-2:#121a30;
    --border:#1e2a47;
    --accent:#39d6ff;
    --accent-2:#8b5cf6;
    --text:#eaf2ff;
    --muted:#7d8bab;
    --danger:#ff5d7a;
    --ok:#42e2a8;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }

  *{box-sizing:border-box;}

  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  html,body{height:100%;margin:0;}

  body{
    background:
      radial-gradient(1200px 600px at 50% -10%, #16224a 0%, transparent 60%),
      radial-gradient(900px 500px at 90% 110%, #2a1350 0%, transparent 55%),
      var(--bg-0);
    color:var(--text);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    min-height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  /* ---------- header ---------- */
  header{
    width:100%;
    max-width:720px;
    padding:20px 20px 8px;
    text-align:center;
  }

  h1{
    font-size:clamp(1.1rem,4.5vw,1.6rem);
    font-weight:700;
    letter-spacing:.2px;
    margin:0 0 4px;
    background:linear-gradient(120deg,var(--accent),var(--accent-2));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }

  .tagline{
    color:var(--muted);
    font-size:.82rem;
    margin:0;
  }

  .lang-toggle{
    display:inline-flex;
    gap:6px;
    margin-top:14px;
    background:var(--panel);
    border:1px solid var(--border);
    padding:4px;
    border-radius:999px;
  }

  .lang-btn{
    border:none;
    background:transparent;
    color:var(--muted);
    font-size:.78rem;
    padding:7px 16px;
    border-radius:999px;
    cursor:pointer;
    font-family:inherit;
    transition:background .15s,color .15s;
  }

  .lang-btn.active{
    background:linear-gradient(120deg,var(--accent),var(--accent-2));
    color:#04060d;
    font-weight:700;
  }

  /* ---------- core ---------- */
  .core-section{
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:22px 20px 6px;
  }

  .core-wrap{
    position:relative;
    width:178px;
    height:178px;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .ring{
    position:absolute;
    border-radius:50%;
    border:1.5px solid var(--accent);
    opacity:.3;
  }

  .ring1{
    width:178px;
    height:178px;
  }

  .ring2{
    width:136px;
    height:136px;
    border-color:var(--accent-2);
  }

  .core-btn{
    width:100px;
    height:100px;
    border-radius:50%;
    border:none;
    cursor:pointer;
    background:radial-gradient(circle at 35% 30%,#8b5cf6,#0b1230 72%);
    box-shadow:
      0 0 36px rgba(57,214,255,.35),
      inset 0 0 26px rgba(139,92,246,.55);
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    color:#fff;
    font-size:.66rem;
    font-weight:700;
    letter-spacing:.4px;
    line-height:1.35;
    transition:transform .15s ease;
  }

  .core-btn:active{
    transform:scale(.95);
  }

  .listening .ring1{
    animation:pulse 1.3s ease-out infinite;
  }

  .listening .ring2{
    animation:pulse 1.3s ease-out infinite .28s;
  }

  .speaking .core-btn{
    animation:glow 1s ease-in-out infinite;
  }

  .core-btn:disabled{
    opacity:.55;
    cursor:not-allowed;
  }

  @keyframes pulse{
    0%{transform:scale(.82);opacity:.55}
    100%{transform:scale(1.3);opacity:0}
  }

  @keyframes glow{
    0%,100%{
      box-shadow:0 0 36px rgba(57,214,255,.35)
    }
    50%{
      box-shadow:0 0 62px rgba(57,214,255,.85)
    }
  }

  .mic-status{
    min-height:20px;
    color:var(--muted);
    font-size:.82rem;
    margin-top:14px;
    text-align:center;
  }

  .mic-status.err{
    color:var(--danger);
  }

  .mic-status.ok{
    color:var(--ok);
  }

  /* ---------- chat ---------- */
  main{
    width:100%;
    max-width:720px;
    flex:1;
    display:flex;
    flex-direction:column;
    padding:10px 16px 16px;
    min-height:0;
  }

  .chat-panel{
    flex:1;
    min-height:220px;
    max-height:48vh;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:16px;
    padding:14px;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:10px;
  }

  .chat-panel:empty::before{
    content:"Tap the core or type below to start talking to Jarvis.";
    color:var(--muted);
    font-size:.85rem;
  }

  .msg{
    max-width:86%;
    padding:9px 13px;
    border-radius:14px;
    font-size:.9rem;
    line-height:1.5;
  }

  .msg.user{
    align-self:flex-end;
    background:linear-gradient(120deg,#2a3b66,#1b2540);
    border-bottom-right-radius:4px;
  }

  .msg.jarvis{
    align-self:flex-start;
    background:var(--panel-2);
    border:1px solid var(--border);
    border-bottom-left-radius:4px;
  }

  .msg .who{
    display:block;
    font-size:.65rem;
    text-transform:uppercase;
    letter-spacing:.5px;
    color:var(--muted);
    margin-bottom:3px;
  }

  .msg.user .who{
    color:var(--accent);
  }

  .msg.jarvis .who{
    color:var(--accent-2);
  }

  .thinking{
    align-self:flex-start;
    display:flex;
    gap:4px;
    padding:10px 13px;
  }

  .thinking span{
    width:6px;
    height:6px;
    border-radius:50%;
    background:var(--accent);
    animation:blink 1.2s infinite;
  }

  .thinking span:nth-child(2){
    animation-delay:.2s;
  }

  .thinking span:nth-child(3){
    animation-delay:.4s;
  }

  @keyframes blink{
    0%,80%,100%{opacity:.2}
    40%{opacity:1}
  }

  /* ---------- input row ---------- */
  .input-row{
    display:flex;
    gap:8px;
    margin-top:12px;
  }

  #textInput{
    flex:1;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:12px;
    color:var(--text);
    padding:12px 14px;
    font-size:.9rem;
    font-family:inherit;
    outline:none;
  }

  #textInput:focus{
    border-color:var(--accent);
  }

  .btn{
    border:none;
    border-radius:12px;
    padding:0 18px;
    font-size:.85rem;
    font-weight:700;
    cursor:pointer;
    font-family:inherit;
    white-space:nowrap;
  }

  .btn-send{
    background:linear-gradient(120deg,var(--accent),var(--accent-2));
    color:#04060d;
  }

  .btn-send:disabled{
    opacity:.5;
    cursor:not-allowed;
  }

  .row-2{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:10px;
    gap:8px;
    flex-wrap:wrap;
  }

  .btn-clear{
    background:transparent;
    border:1px solid var(--border);
    color:var(--muted);
    padding:7px 14px;
    font-size:.78rem;
    border-radius:10px;
  }

  .btn-clear:hover{
    border-color:var(--danger);
    color:var(--danger);
  }

  .footnote{
    color:var(--muted);
    font-size:.7rem;
    text-align:center;
    max-width:480px;
    margin:6px auto 0;
  }

  ::-webkit-scrollbar{
    width:6px;
  }

  ::-webkit-scrollbar-thumb{
    background:var(--border);
    border-radius:3px;
  }

  @media (max-width:420px){
    .core-wrap{
      width:150px;
      height:150px;
    }

    .ring1{
      width:150px;
      height:150px;
    }

    .ring2{
      width:114px;
      height:114px;
    }

    .core-btn{
      width:86px;
      height:86px;
      font-size:.6rem;
    }
  }
</style>
</head>

<body>

<header>
  <h1>rinkal bhai ka jarves assistant</h1>
  <p class="tagline">Your personal voice-powered AI assistant</p>

  <div class="lang-toggle" id="langToggle">
    <button class="lang-btn active" data-lang="en" id="btnEn" type="button">English</button>
    <button class="lang-btn" data-lang="hi" id="btnHi" type="button">हिंदी</button>
  </div>
</header>

<section class="core-section">
  <div class="core-wrap" id="coreWrap">
    <div class="ring ring1"></div>
    <div class="ring ring2"></div>

    <button class="core-btn" id="coreBtn" type="button" aria-label="Tap to speak">
      TAP TO<br>SPEAK
    </button>
  </div>

  <div class="mic-status" id="micStatus">
    Tap the core to talk to Jarvis
  </div>
</section>

<main>

  <div class="chat-panel" id="chatPanel"></div>

  <div class="input-row">
    <input
      type="text"
      id="textInput"
      placeholder="Type a message to Jarvis..."
      maxlength="1000"
      autocomplete="off"
    >

    <button class="btn btn-send" id="sendBtn" type="button">
      Send
    </button>
  </div>

  <div class="row-2">
    <button class="btn-clear" id="clearBtn" type="button">
      Clear chat
    </button>

    <span class="footnote" id="apiNote" style="margin:0;"></span>
  </div>

  <p class="footnote">
    Voice input needs Chrome/Edge on Android or desktop and microphone permission.
    If unsupported, use the text box instead.
  </p>

</main>

<script>
(function(){
  "use strict";

  /* ---------------- state ---------------- */

  var currentLang = 'en';
  var conversation = [];
  var MAX_HISTORY = 16;
  var isBusy = false;

  var recognition = null;
  var recognizing = false;

  var synth = window.speechSynthesis;

  /* FIRST TAP GREETING */
  var firstTapDone = false;

  /* ---------------- dom ---------------- */

  var chatPanel   = document.getElementById('chatPanel');
  var micStatus   = document.getElementById('micStatus');
  var coreWrap    = document.getElementById('coreWrap');
  var coreBtn     = document.getElementById('coreBtn');
  var textInput   = document.getElementById('textInput');
  var sendBtn     = document.getElementById('sendBtn');
  var clearBtn    = document.getElementById('clearBtn');
  var btnEn       = document.getElementById('btnEn');
  var btnHi       = document.getElementById('btnHi');
  var apiNote     = document.getElementById('apiNote');

  /* ---------------- language ---------------- */

  function setLang(lang){
    currentLang = lang;

    btnEn.classList.toggle('active', lang === 'en');
    btnHi.classList.toggle('active', lang === 'hi');

    if(recognition){
      recognition.lang = lang === 'hi' ? 'hi-IN' : 'en-US';
    }

    textInput.placeholder =
      lang === 'hi'
        ? 'Jarvis को यहाँ टाइप करें...'
        : 'Type a message to Jarvis...';

    setMicStatus(
      lang === 'hi'
        ? 'बात करने के लिए कोर पर टैप करें'
        : 'Tap the core to talk to Jarvis'
    );
  }

  btnEn.addEventListener('click', function(){
    setLang('en');
  });

  btnHi.addEventListener('click', function(){
    setLang('hi');
  });

  /* ---------------- helpers ---------------- */

  function setMicStatus(text, kind){
    micStatus.textContent = text;

    micStatus.className =
      'mic-status' + (kind ? ' ' + kind : '');
  }

  function addMessageToUI(role, text){
    var div = document.createElement('div');

    div.className =
      'msg ' + (role === 'user' ? 'user' : 'jarvis');

    var who = document.createElement('span');

    who.className = 'who';

    who.textContent =
      role === 'user' ? 'You' : 'Jarvis';

    div.appendChild(who);

    var body = document.createElement('div');

    body.textContent = text;

    div.appendChild(body);

    chatPanel.appendChild(div);

    chatPanel.scrollTop =
      chatPanel.scrollHeight;
  }

  function showThinking(){
    var div = document.createElement('div');

    div.className = 'thinking';
    div.id = 'thinkingIndicator';

    div.innerHTML =
      '<span></span><span></span><span></span>';

    chatPanel.appendChild(div);

    chatPanel.scrollTop =
      chatPanel.scrollHeight;
  }

  function hideThinking(){
    var el =
      document.getElementById('thinkingIndicator');

    if(el){
      el.remove();
    }
  }

  function pushHistory(role, content){
    conversation.push({
      role: role,
      content: content
    });

    if(conversation.length > MAX_HISTORY){
      conversation =
        conversation.slice(
          conversation.length - MAX_HISTORY
        );
    }
  }

  /* ---------------- improved speech synthesis ---------------- */

  function getHindiVoice(){
    if(!synth) return null;

    var voices = synth.getVoices() || [];

    var exactHindi = null;
    var indianHindi = null;

    for(var i = 0; i < voices.length; i++){

      var voice = voices[i];
      var lang = (voice.lang || '').toLowerCase();
      var name = (voice.name || '').toLowerCase();

      /*
       * First preference:
       * Exact Hindi-India voices.
       */
      if(lang === 'hi-in'){
        exactHindi = voice;
        break;
      }

      /*
       * Second preference:
       * Any Hindi voice.
       */
      if(
        !indianHindi &&
        (
          lang.indexOf('hi') === 0 ||
          name.indexOf('hindi') !== -1 ||
          name.indexOf('india') !== -1
        )
      ){
        indianHindi = voice;
      }
    }

    return exactHindi || indianHindi || null;
  }

  function pickVoice(langTag){

    if(!synth) return null;

    var voices =
      synth.getVoices() || [];

    var exact = null;
    var partial = null;

    for(var i = 0; i < voices.length; i++){

      var lang =
        (voices[i].lang || '').toLowerCase();

      var wanted =
        langTag.toLowerCase();

      if(lang === wanted){
        exact = voices[i];
        break;
      }

      if(
        !partial &&
        lang.indexOf(
          wanted.split('-')[0]
        ) === 0
      ){
        partial = voices[i];
      }
    }

    /*
     * Special Hindi handling.
     */
    if(langTag === 'hi-IN'){
      return getHindiVoice() || exact || partial || null;
    }

    return exact || partial || null;
  }

  function speak(text){

    return new Promise(function(resolve){

      if(!synth || !text){
        resolve();
        return;
      }

      try{

        synth.cancel();

        var langTag =
          currentLang === 'hi'
            ? 'hi-IN'
            : 'en-US';

        var u =
          new SpeechSynthesisUtterance(text);

        u.lang = langTag;

        var voice =
          pickVoice(langTag);

        if(voice){
          u.voice = voice;
        }

        /*
         * Hindi ko thoda natural/slower rakha hai.
         */
        if(currentLang === 'hi'){
          u.rate = 0.88;
          u.pitch = 1.0;
        }else{
          u.rate = 1.0;
          u.pitch = 1.0;
        }

        coreWrap.classList.add('speaking');

        u.onend = function(){
          coreWrap.classList.remove('speaking');
          resolve();
        };

        u.onerror = function(){
          coreWrap.classList.remove('speaking');
          resolve();
        };

        synth.speak(u);

      }catch(e){

        coreWrap.classList.remove('speaking');
        resolve();

      }

    });
  }

  /* ---------------- speech recognition ---------------- */

  function createRecognition(){

    var SR =
      window.SpeechRecognition ||
      window.webkitSpeechRecognition;

    if(!SR){
      return null;
    }

    var r = new SR();

    r.lang =
      currentLang === 'hi'
        ? 'hi-IN'
        : 'en-US';

    r.continuous = false;
    r.interimResults = false;
    r.maxAlternatives = 1;

    return r;
  }

  function startListening(){

    if(isBusy || recognizing){
      return;
    }

    recognition =
      createRecognition();

    if(!recognition){

      setMicStatus(
        currentLang === 'hi'
          ? 'इस ब्राउज़र में वॉइस इनपुट उपलब्ध नहीं है — नीचे टाइप करें।'
          : 'Voice input isn\'t supported in this browser — please type below.',
        'err'
      );

      return;
    }

    recognition.lang =
      currentLang === 'hi'
        ? 'hi-IN'
        : 'en-US';

    recognition.onstart = function(){

      recognizing = true;

      coreWrap.classList.add('listening');

      coreBtn.disabled = false;

      setMicStatus(
        currentLang === 'hi'
          ? '🎙️ सुन रहा हूँ... बोलिए'
          : '🎙️ Listening... speak now'
      );
    };

    recognition.onresult = function(e){

      var text =
        (
          e.results &&
          e.results[0] &&
          e.results[0][0] &&
          e.results[0][0].transcript
        ) || '';

      text = text.trim();

      coreWrap.classList.remove('listening');

      recognizing = false;

      if(!text){

        setMicStatus(
          currentLang === 'hi'
            ? 'कुछ सुनाई नहीं दिया। फिर कोशिश करें।'
            : 'Didn\'t catch anything. Try again.',
          'err'
        );

        return;
      }

      setMicStatus(
        currentLang === 'hi'
          ? 'मिल गया, सोच रहा हूँ...'
          : 'Got it — thinking...'
      );

      sendToJarvis(text);
    };

    recognition.onerror = function(e){

      coreWrap.classList.remove('listening');

      recognizing = false;

      var errMsg;

      if(e && e.error === 'not-allowed'){

        errMsg =
          currentLang === 'hi'
            ? 'माइक्रोफ़ोन की अनुमति नहीं मिली। Chrome की microphone permission जांचें।'
            : 'Microphone permission denied. Check Chrome microphone permission.';

      }else if(e && e.error === 'no-speech'){

        errMsg =
          currentLang === 'hi'
            ? 'कोई आवाज़ नहीं सुनाई दी। फिर कोशिश करें।'
            : 'No speech detected. Try again.';

      }else if(e && e.error === 'network'){

        errMsg =
          currentLang === 'hi'
            ? 'वॉइस सर्विस से कनेक्शन में समस्या हुई। इंटरनेट जांचें।'
            : 'Voice service connection problem. Check your internet.';

      }else{

        errMsg =
          currentLang === 'hi'
            ? 'सुनने में समस्या हुई। फिर कोशिश करें।'
            : 'Trouble listening. Please try again.';
      }

      setMicStatus(errMsg, 'err');
    };

    recognition.onend = function(){

      coreWrap.classList.remove('listening');

      recognizing = false;

      if(!isBusy){

        coreBtn.disabled = false;
      }
    };

    try{

      recognition.start();

    }catch(e){

      coreWrap.classList.remove('listening');

      recognizing = false;

      setMicStatus(
        currentLang === 'hi'
          ? 'माइक्रोफ़ोन शुरू नहीं हो सका। फिर टैप करें।'
          : 'Could not start the microphone. Tap again.',
        'err'
      );
    }
  }

  /* ---------------- first tap + microphone ---------------- */

  coreBtn.addEventListener('click', function(){

    if(isBusy || recognizing){
      return;
    }

    /*
     * FIRST TAP:
     * Jarvis greets the boss.
     */
    if(!firstTapDone){

      firstTapDone = true;

      setMicStatus(
        'Hello Priyansh boss, how are you?'
      );

      speakEnglishGreeting();

      return;
    }

    startListening();
  });

  function speakEnglishGreeting(){

    if(!synth){
      startListening();
      return;
    }

    try{

      synth.cancel();

      var greeting =
        new SpeechSynthesisUtterance(
          'Hello Priyansh boss, how are you?'
        );

      greeting.lang = 'en-US';

      var voices =
        synth.getVoices() || [];

      var englishVoice = null;

      for(var i = 0; i < voices.length; i++){

        var lang =
          (voices[i].lang || '').toLowerCase();

        if(lang === 'en-us'){
          englishVoice = voices[i];
          break;
        }
      }

      if(englishVoice){
        greeting.voice = englishVoice;
      }

      greeting.rate = 0.95;
      greeting.pitch = 1.0;

      coreWrap.classList.add('speaking');

      greeting.onend = function(){

        coreWrap.classList.remove('speaking');

        setMicStatus(
          'Tap again and speak...'
        );
      };

      greeting.onerror = function(){

        coreWrap.classList.remove('speaking');

        setMicStatus(
          'Tap again and speak...'
        );
      };

      synth.speak(greeting);

    }catch(e){

      coreWrap.classList.remove('speaking');

      setMicStatus(
        'Tap again and speak...'
      );
    }
  }

  /* ---------------- backend call ---------------- */

  function sendToJarvis(userText){

    if(!userText || !userText.trim() || isBusy){
      return;
    }

    isBusy = true;

    sendBtn.disabled = true;
    coreBtn.disabled = true;
    textInput.disabled = true;

    addMessageToUI('user', userText);

    pushHistory('user', userText);

    showThinking();

    fetch('/.netlify/functions/chat', {
      method: 'POST',

      headers:{
        'Content-Type':'application/json'
      },

      body:JSON.stringify({
        messages:conversation,
        lang:currentLang
      })
    })

    .then(function(res){

      return res.json().then(function(data){

        return {
          ok:res.ok,
          status:res.status,
          data:data
        };

      });

    })

    .then(function(result){

      hideThinking();

      if(!result.ok){

        var errText =
          (result.data && result.data.error) ||
          (
            currentLang === 'hi'
              ? 'कुछ गड़बड़ हो गई।'
              : 'Something went wrong.'
          );

        if(result.status === 429){

          errText =
            currentLang === 'hi'
              ? 'बहुत सारे अनुरोध हो गए। कृपया थोड़ी देर बाद कोशिश करें।'
              : 'Too many requests right now. Please try again in a moment.';

        }else if(
          result.status === 401 ||
          result.status === 500
        ){

          errText =
            currentLang === 'hi'
              ? 'AI सेवा से जुड़ने में समस्या है। बाद में कोशिश करें।'
              : 'Trouble reaching the AI service. Please try again later.';
        }

        addMessageToUI(
          'jarvis',
          errText
        );

        setMicStatus(
          currentLang === 'hi'
            ? 'त्रुटि हुई'
            : 'An error occurred',
          'err'
        );

        return;
      }

      var reply =
        (
          result.data &&
          result.data.reply
        )
          ? result.data.reply.trim()
          : '';

      if(!reply){

        reply =
          currentLang === 'hi'
            ? 'माफ़ कीजिए बॉस, जवाब नहीं मिल पाया।'
            : 'Sorry boss, I didn\'t get a reply.';
      }

      addMessageToUI(
        'jarvis',
        reply
      );

      pushHistory(
        'assistant',
        reply
      );

      setMicStatus(
        currentLang === 'hi'
          ? 'तैयार हूँ'
          : 'Ready',
        'ok'
      );

      speak(reply);

    })

    .catch(function(){

      hideThinking();

      var netErr =
        currentLang === 'hi'
          ? 'नेटवर्क में समस्या है। इंटरनेट जांचें।'
          : 'Network problem — please check your connection.';

      addMessageToUI(
        'jarvis',
        netErr
      );

      setMicStatus(
        netErr,
        'err'
      );

    })

    .finally(function(){

      isBusy = false;

      sendBtn.disabled = false;
      coreBtn.disabled = false;
      textInput.disabled = false;

      textInput.focus();
    });
  }

  /* ---------------- text input ---------------- */

  sendBtn.addEventListener('click', function(){

    var val = textInput.value;

    textInput.value = '';

    sendToJarvis(val);
  });

  textInput.addEventListener('keydown', function(e){

    if(e.key === 'Enter' && !e.shiftKey){

      e.preventDefault();

      var val = textInput.value;

      textInput.value = '';

      sendToJarvis(val);
    }
  });

  /* ---------------- clear chat ---------------- */

  clearBtn.addEventListener('click', function(){

    if(isBusy){
      return;
    }

    var msg =
      currentLang === 'hi'
        ? 'क्या आप पूरी बातचीत मिटाना चाहते हैं?'
        : 'Clear the entire conversation?';

    if(window.confirm(msg)){

      chatPanel.innerHTML = '';

      conversation = [];

      setMicStatus(
        currentLang === 'hi'
          ? 'बातचीत साफ़ हो गई'
          : 'Chat cleared'
      );
    }
  });

  /* ---------------- init ---------------- */

  if(
    synth &&
    synth.onvoiceschanged !== undefined
  ){

    synth.onvoiceschanged = function(){
      /*
       * Browser voices loaded.
       * Hindi voice selection will use them automatically.
       */
    };
  }

  setLang('en');

})();
</script>

</body>
</html>
